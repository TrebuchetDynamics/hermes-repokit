# Explicit live qualification fixture, not installed by repokit.
# Prepare the isolated root and admit/configure Nerve before starting this
# offline stack; see docs/qualification/generic-team-laya.md.
services:
  hermes:
    image: nousresearch/hermes-agent@sha256:d4da4a40cd7a28aba983775d9fd31d94cbf153eeb0cb9e844d6d0f612b7c24db
    command: [sleep, infinity]
    network_mode: none
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      HERMES_HOME: /opt/data
      HERMES_SAFE_ROOTS: /workspace,/opt/data
    working_dir: /workspace
    volumes:
      - ${LAYA_FIXTURE_ROOT:?set an isolated qualification root}/workspace:/workspace
      - ${LAYA_FIXTURE_ROOT}/hermes:/opt/data
    cpus: 4
    mem_limit: 8g
  laya:
    image: python@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
    network_mode: service:hermes
    depends_on:
      - hermes
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    environment:
      HOME: /tmp
      USER: laya
      USE_TF: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TORCHINDUCTOR_CACHE_DIR: /tmp/torchinductor
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONPATH: /deps:/nerve
    volumes:
      - ${LAYA_FIXTURE_ROOT}/venv/lib/python3.12/site-packages:/deps:ro
      - ${LAYA_FIXTURE_ROOT}/model:/model:ro
      - ${LAYA_FIXTURE_ROOT}/nerve:/nerve:ro
    working_dir: /nerve
    command: [python, -m, hermes_nerve.reflex.laya_service, --host, 127.0.0.1, --port, "8765", --device, cpu, --model, /model]
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8765/healthz',timeout=2)); assert r == {'ok':True,'provider':'Laya','model':'/model','transport':'laya-local-http'}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    cpus: 4
    mem_limit: 6g
