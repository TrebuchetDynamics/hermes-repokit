# Native state is authoritative. Ordinary Docker Compose owns this deployment.
name: "repokit-0123456789abcdef01234567"
services:
  hermes:
    image: "repokit/hermes-atlas:abababababababababababab"
    build:
      context: ./development-image
    platform: linux/amd64
    pull_policy: build
    container_name: "hermes-atlas"
    restart: unless-stopped
    working_dir: /workspace
    # Keep the native exec endpoint available before interactive provider setup.
    command: ["sleep", "infinity"]
    environment:
      HERMES_HOME: /opt/data
      HERMES_WRITE_SAFE_ROOT: /opt/data:/workspace
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      REPOKIT_OPENVIKING: "1"
    volumes:
      - type: bind
        source: ".."
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: "."
        target: /opt/data
        bind:
          create_host_path: false
      - type: volume
        source: docker-test-run
        target: /docker-test/run
        read_only: true
      - type: volume
        source: docker-test-work
        target: /docker-tests
  docker-test:
    image: "docker:29.8.0-dind@sha256:5efed980cba3fc126cf54e21a5a6ff8849d05b6e0623d6e7612f48e9cd6cd17e"
    profiles: [docker-tests]
    privileged: true
    restart: unless-stopped
    networks: [docker-test]
    environment:
      DOCKER_TLS_CERTDIR: ""
    entrypoint: ["sh", "-ec"]
    command:
      - "mkdir -p /docker-test/run /docker-tests; chown 0:1000 /docker-test/run; chmod 0750 /docker-test/run; chown 1000:1000 /docker-tests; chmod 0700 /docker-tests; exec dockerd-entrypoint.sh dockerd --host=unix:///docker-test/run/docker.sock --group=1000 --label=io.repokit.docker-test=1"
    healthcheck:
      test: ["CMD", "docker", "--host=unix:///docker-test/run/docker.sock", "info", "--format", "{{json .ID}}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - type: volume
        source: docker-test-run
        target: /docker-test/run
      - type: volume
        source: docker-test-work
        target: /docker-tests
      - type: volume
        source: docker-test-data
        target: /var/lib/docker
volumes:
  docker-test-run:
  docker-test-work:
  docker-test-data:
networks:
  docker-test:
