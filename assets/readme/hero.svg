<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Hermes RepoKit — one repository-specific Hermes development container</title>
  <desc id="heroDesc">Hermes RepoKit bootstraps a single Docker Hermes container holding seven coordinated profiles, a shared Kanban board and embedded memory.</desc>

  <rect width="1200" height="380" rx="24" fill="#0A0D0F"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="23.5" fill="none" stroke="#1E2A31"/>

  <!-- identity -->
  <g id="title-block">
    <text x="56" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" letter-spacing="2.4" fill="#F0B24A">ONE CONTAINER · SEVEN PROFILES · EMBEDDED MEMORY</text>
    <text x="56" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="60" font-weight="700" fill="#E8EEF2">Hermes RepoKit</text>
    <rect x="58" y="182" width="72" height="4" rx="2" fill="#F0B24A"/>
    <text x="56" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#AAB9C4">Bootstrap one repository-specific Hermes development</text>
    <text x="56" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#AAB9C4">container — seven profiles, a shared task board and</text>
    <text x="56" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#AAB9C4">embedded memory, generated as ordinary Compose.</text>
    <rect x="56" y="304" width="452" height="48" rx="10" fill="#12181C" stroke="#26333B"/>
    <text x="76" y="334" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#5BD1A8">$ hermes-repokit install</text>
    <text x="492" y="334" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#7F909C"># then setup · verify</text>
  </g>

  <!-- project proof: one container, seven roles -->
  <g id="project-proof">
    <rect x="660" y="44" width="484" height="292" rx="16" fill="#12181C" stroke="#26333B"/>
    <line x1="660" y1="88" x2="1144" y2="88" stroke="#26333B"/>
    <circle cx="684" cy="66" r="5" fill="#33454F"/>
    <circle cx="704" cy="66" r="5" fill="#33454F"/>
    <circle cx="724" cy="66" r="5" fill="#33454F"/>
    <text x="748" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#E8EEF2">hermes-&lt;repo&gt;</text>
    <text x="1128" y="72" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#7F909C">docker compose</text>

    <g id="role-roster">
      <rect x="680" y="100" width="216" height="44" rx="10" fill="#172128" stroke="#26333B"/>
      <text x="694" y="119" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="600" fill="#E8EEF2">default</text>
      <text x="694" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#8FA0AC">coordinates the work</text>

      <rect x="912" y="100" width="216" height="44" rx="10" fill="#172128" stroke="#26333B"/>
      <text x="926" y="119" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="600" fill="#E8EEF2">researcher</text>
      <text x="926" y="136" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#8FA0AC">resolves unknowns</text>

      <rect x="680" y="150" width="216" height="44" rx="10" fill="#172128" stroke="#26333B"/>
      <text x="694" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="600" fill="#E8EEF2">planner</text>
      <text x="694" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#8FA0AC">bounds the work</text>

      <rect x="912" y="150" width="216" height="44" rx="10" fill="#172128" stroke="#26333B"/>
      <text x="926" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="600" fill="#E8EEF2">executor</text>
      <text x="926" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#8FA0AC">produces the artifact</text>

      <rect x="680" y="200" width="216" height="44" rx="10" fill="#172128" stroke="#26333B"/>
      <text x="694" y="219" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="600" fill="#E8EEF2">tester</text>
      <text x="694" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#8FA0AC">proves the behavior</text>

      <rect x="912" y="200" width="216" height="44" rx="10" fill="#172128" stroke="#26333B"/>
      <text x="926" y="219" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="600" fill="#E8EEF2">reviewer</text>
      <text x="926" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#8FA0AC">accepts the change</text>

      <rect x="680" y="250" width="216" height="44" rx="10" fill="#172128" stroke="#26333B"/>
      <text x="694" y="269" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="600" fill="#E8EEF2">steward</text>
      <text x="694" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#8FA0AC">owns team lifecycle</text>
    </g>

    <circle cx="684" cy="312" r="4" fill="#5BD1A8"/>
    <text x="698" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#7F909C">shared Kanban · embedded memory · loopback only</text>
  </g>
</svg>
