<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="lifeTitle lifeDesc">
  <title id="lifeTitle">Hermes RepoKit setup lifecycle</title>
  <desc id="lifeDesc">Five stages: plan inspects without writing, install publishes the Compose deployment, setup runs private provider and team activation, verify reports health read-only, and the generated launcher opens native chat without RepoKit.</desc>

  <rect width="1200" height="300" rx="24" fill="#0A0D0F"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="23.5" fill="none" stroke="#1E2A31"/>

  <g id="lifecycle-header">
    <text x="56" y="54" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" letter-spacing="2.4" fill="#F0B24A">SETUP LIFECYCLE</text>
    <text x="1144" y="54" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#7F909C">plan and verify write nothing</text>
  </g>

  <g id="stages" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <!-- 01 plan -->
    <rect x="56" y="92" width="208" height="156" rx="14" fill="#12181C" stroke="#26333B"/>
    <text x="70" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#F0B24A">01</text>
    <text x="250" y="122" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1.2" fill="#5BD1A8">READ-ONLY</text>
    <text x="70" y="158" font-size="21" font-weight="600" fill="#E8EEF2">plan</text>
    <text x="70" y="186" font-size="13" fill="#8FA0AC">Inspect the target</text>
    <text x="70" y="204" font-size="13" fill="#8FA0AC">without writing.</text>
    <text x="70" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#5BD1A8">hermes-repokit plan</text>

    <!-- 02 install -->
    <rect x="276" y="92" width="208" height="156" rx="14" fill="#12181C" stroke="#26333B"/>
    <text x="290" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#F0B24A">02</text>
    <text x="470" y="122" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1.2" fill="#F0B24A">WRITES</text>
    <text x="290" y="158" font-size="21" font-weight="600" fill="#E8EEF2">install</text>
    <text x="290" y="186" font-size="13" fill="#8FA0AC">Publish Compose,</text>
    <text x="290" y="204" font-size="13" fill="#8FA0AC">launcher and state.</text>
    <text x="290" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#5BD1A8">hermes-repokit install</text>

    <!-- 03 setup -->
    <rect x="496" y="92" width="208" height="156" rx="14" fill="#12181C" stroke="#26333B"/>
    <text x="510" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#F0B24A">03</text>
    <text x="690" y="122" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1.2" fill="#F0B24A">INTERACTIVE</text>
    <text x="510" y="158" font-size="21" font-weight="600" fill="#E8EEF2">setup</text>
    <text x="510" y="186" font-size="13" fill="#8FA0AC">Private provider, team,</text>
    <text x="510" y="204" font-size="13" fill="#8FA0AC">memory, activation.</text>
    <text x="510" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#5BD1A8">hermes-repokit setup</text>

    <!-- 04 verify -->
    <rect x="716" y="92" width="208" height="156" rx="14" fill="#12181C" stroke="#26333B"/>
    <text x="730" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#F0B24A">04</text>
    <text x="910" y="122" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1.2" fill="#5BD1A8">READ-ONLY</text>
    <text x="730" y="158" font-size="21" font-weight="600" fill="#E8EEF2">verify</text>
    <text x="730" y="186" font-size="13" fill="#8FA0AC">Health and gate report;</text>
    <text x="730" y="204" font-size="13" fill="#8FA0AC">never dispatches.</text>
    <text x="730" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#5BD1A8">hermes-repokit verify</text>

    <!-- 05 launcher -->
    <rect x="936" y="92" width="208" height="156" rx="14" fill="#12181C" stroke="#26333B"/>
    <text x="950" y="122" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#F0B24A">05</text>
    <text x="1130" y="122" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1.2" fill="#5BD1A8">STANDALONE</text>
    <text x="950" y="158" font-size="21" font-weight="600" fill="#E8EEF2">launcher</text>
    <text x="950" y="186" font-size="13" fill="#8FA0AC">Native chat as default.</text>
    <text x="950" y="204" font-size="13" fill="#8FA0AC">RepoKit not needed.</text>
    <text x="950" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#5BD1A8">.hermes/bin/hermes-&lt;repo&gt;</text>
  </g>

  <g id="stage-flow" stroke="#33454F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M266 166 l6 6 -6 6"/>
    <path d="M486 166 l6 6 -6 6"/>
    <path d="M706 166 l6 6 -6 6"/>
    <path d="M926 166 l6 6 -6 6"/>
  </g>

  <text x="56" y="282" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#7F909C">setup runs in your private terminal; verification never dispatches tasks or runs inference.</text>
</svg>
